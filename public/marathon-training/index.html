<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SGIM 2026 Training Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="sgim.css">
<script src="sgim.js"></script>
<style>
/* Page-only styles. Shared tokens and components live in sgim.css. */
main{padding-top:24px;display:flex;flex-direction:column;gap:14px}

/* 1 · headline numbers + a static 70-day calendar (row per week, Mon to Sun left to right) */
/* an open masthead band between heavy rules, not another box */
.overview.panel{padding:18px 0;position:relative;isolation:isolate;overflow:hidden;border:0;border-radius:0;border-block:4px solid var(--ink)}
.overview .kpi:first-child{padding-left:0;position:relative}
/* the race-morning sun, printed in halftone, rising behind the countdown */
.tx .overview .kpi:first-child::before{content:"";position:absolute;z-index:-1;width:210px;aspect-ratio:1;left:-58px;top:-62px;background:var(--blood);-webkit-mask:var(--tx-sun) center/contain no-repeat;mask:var(--tx-sun) center/contain no-repeat}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto}
.kpi{padding:0 18px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-width:0}
.kpi+.kpi{border-left:1.5px solid var(--ink)}
.kpi b{font:800 clamp(52px,13vw,88px)/.82 var(--disp);letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b small,.wstats b small{font:400 13px var(--mono);letter-spacing:.02em;color:var(--ink-2);margin-left:2px}
.kpi .lbl{white-space:nowrap;align-self:flex-start;background:var(--silver);padding:1px 4px;margin-left:-4px} /* knocked out of the sun */
.cal{display:grid;grid-template-columns:repeat(7,8px);grid-auto-rows:8px;gap:2px}
.cal i{border:1.2px solid var(--ink);border-radius:50%}
.cal i.done{background:var(--ink);border-color:var(--ink)}
.cal i.missed{border-color:var(--ink-2);border-style:dotted}
.cal i.rest{border:0;background:radial-gradient(circle,var(--ink-2) 1.3px,transparent 1.6px)}
.cal i.race{border-color:var(--blood);border-width:2px}
.cal i.race.done{background:var(--blood)}
.cal i.tdd{background:var(--blue);border-color:var(--blue)}

/* 2 · today */
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tbody{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 16px;margin-top:18px}
.tmeta{display:flex;align-items:center;gap:10px;margin-top:8px}
.tmeta:empty{display:none}
.today .steps{margin-top:16px}
.today.rest .tname{color:var(--on-blue-2)}

/* 3 · week */
.wsec{display:flex;flex-direction:column;gap:10px;margin-top:10px;scroll-margin-top:var(--nav-h)}
.hbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-top:4px}
.wstats{display:flex;gap:18px;font:400 13px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.wstats b{display:block;font:800 40px/.9 var(--disp);letter-spacing:0;color:var(--ink);text-transform:none;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.fend{display:flex;align-items:center;gap:18px;margin-left:auto}
.btn.icon{width:36px;padding:0}
.key{display:flex;gap:14px;flex-wrap:wrap}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .chk{width:11px;height:11px;background-size:8px}
.key .done .chk{border-color:var(--blood);background-color:var(--blood);background-image:var(--check)}
.key .missed .chk{border-style:dashed;border-color:var(--ink-2)}

/* week image sheet */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(17,18,23,.92) radial-gradient(circle,rgba(241,240,234,.12) 1.1px,transparent 1.5px) 0 0/6px 6px}
.sheet-card{display:flex;flex-direction:column;align-items:center;gap:12px;max-height:100%;width:min(100%,30rem)}
.sheet img{display:block;max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;border-radius:var(--r-m);-webkit-touch-callout:default;user-select:auto}
.sheet-row{display:flex;gap:8px}
.sheet .btn{color:#F1F0EA;border-color:rgba(241,240,234,.6)}
.sheet .btn:hover{background:#F1F0EA;color:#111217;border-color:#F1F0EA}
.sheet .btn.ok{background:var(--blue);border-color:var(--blue);color:#fff}
html.locked{overflow:hidden}

@media (max-width:640px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi.plan{grid-column:1/-1;border-left:0;margin-top:16px;padding-top:16px;padding-left:0;border-top:1.5px solid var(--ink);flex-direction:row;align-items:flex-end;justify-content:flex-start;gap:14px}
}
@media (max-width:640px){.tx .overview .kpi:first-child::before{width:150px;left:-44px;top:-48px}}
@media (max-width:420px){
  .kpi{padding:0 13px}
  .wstats{gap:14px}
  .tname{font-size:21px}
}
</style>
<meta name="description" content="Ten-week training plan and checklist for the BYD Singapore Marathon, updated weekly.">
<meta property="og:title" content="SGIM 2026 Training Plan">
<meta property="og:description" content="Ten-week training plan and checklist for the BYD Singapore Marathon, updated weekly.">
<meta property="og:url" content="https://vnck.xyz/marathon-training/">
</head>
<body>

<nav class="nav"><div class="wrap">
  <span class="mark"><i class="x"></i>SGIM 2026 Training Plan</span>
  <button class="btn mode" id="mode" type="button" aria-label="Switch light or dark mode"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg></button>
</div></nav>
<main class="wrap">
  <section class="panel overview" aria-label="Progress">
    <div class="kpis">
      <div class="kpi"><b id="kDays"></b><span class="lbl" id="kDaysL">Days to race</span></div>
      <div class="kpi"><b id="kRuns"></b><span class="lbl">Runs done</span></div>
      <div class="kpi"><b id="kKm"></b><span class="lbl">Km run</span></div>
      <div class="kpi plan"><div class="cal" id="cal" role="img"></div><span class="lbl">10 weeks</span></div>
    </div>
  </section>

  <section class="todaywrap" aria-label="Workout">
    <div class="field" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="today" id="today">
      <div class="trow">
        <span class="lbl" id="tDate"></span>
        <div class="seg" role="group" aria-label="Day">
          <button type="button" data-o="0" aria-pressed="true">Today</button>
          <button type="button" data-o="1" aria-pressed="false">Tomorrow</button>
        </div>
      </div>
      <div class="tbody">
        <div>
          <div class="tname" id="tName"></div>
          <div class="tmeta" id="tMeta"></div>
        </div>
        <div class="big" id="tKm"></div>
      </div>
      <table class="steps" id="tSteps" hidden></table>
    </div>
  </section>

  <section class="wsec" id="week" aria-label="Weekly schedule">
    <div class="picker"><div class="wrap wks" id="picker" role="group" aria-label="Choose week. Column height shows weekly distance."></div></div>
    <div class="reg" aria-live="polite">
      <div class="whead">
        <h2 id="wtitle"></h2>
        <div class="hbar">
          <div class="wstats">
            <span><b id="sDone"></b>Done</span>
            <span><b id="sKm"></b>Km</span>
          </div>
        </div>
        <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      </div>
    </div>
    <ol class="days" id="days"></ol>
    <div class="foot lbl">
      <span id="updated"></span>
      <span class="fend">
        <span class="key"><span class="done"><i class="chk"></i>Done</span><span class="missed"><i class="chk"></i>Missed</span><span><i class="chk"></i>To do</span></span>
        <button class="btn icon" id="save" type="button" aria-label="Save week image" title="Save week image"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
      </span>
    </div>
  </section>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Week image" hidden>
  <div class="sheet-card">
    <img id="shot" alt="">
    <div class="sheet-row"><button class="btn" id="shotClose" type="button">Close</button><button class="btn ok" id="shotSave" type="button">Save image</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// The plan lives in tracker-data.json next to this page. A sync only needs to edit that file's "log" and "updated".
fetch('tracker-data.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(D){
  // Derive everything that isn't the log. "log" maps a date to true (done as planned) or the km actually run.
  // A session is done if it's in the log; missed if it falls before the last update and isn't; otherwise still to do.
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], LOG=D.log||{};
  D.weeks.forEach(function(w,i){
    w.week=i+1;w.start=w.sessions[0].date;w.end=w.sessions[w.sessions.length-1].date;w.plannedKm=0;w.doneKm=0;
    w.sessions.forEach(function(s){
      s.km=+s.km||0; // km is written straight into markup, so keep it a number
      var got=LOG[s.date];
      s.day=DOW[new Date(s.date).getUTCDay()];
      s.status=s.type==='Rest'?'rest':got?'done':s.date<D.updated?'missed':'planned';
      s.actualKm=typeof got==='number'?got:s.km;
      if(s.date!==D.raceDate){w.plannedKm+=s.km;if(s.status==='done')w.doneKm+=s.actualKm}
    });
    w.plannedKm=Math.round(w.plannedKm);w.doneKm=Math.round(w.doneKm);
  });
  var W=D.weeks, MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var dm=function(iso){return +iso.slice(8,10)+' '+MON[+iso.slice(5,7)-1]};
  var range=function(a,b){return a.slice(5,7)===b.slice(5,7)?(+a.slice(8,10))+'–'+dm(b):dm(a)+' – '+dm(b)};
  var pad=function(n){return String(n).padStart(2,'0')};
  var DAY=864e5;
  var addDay=function(iso,n){return new Date(Date.parse(iso)+n*DAY).toISOString().slice(0,10)};
  // Today in Singapore, where the race is.
  var today=new Date(Date.now()+8*36e5).toISOString().slice(0,10);
  var idx=Math.floor((Date.parse(today)-Date.parse(D.planStart))/DAY);
  var nowWeek=Math.max(1,Math.min(W.length,Math.floor(idx/7)+1));
  var togo=Math.round((Date.parse(D.raceDate)-Date.parse(today))/DAY);
  var all=[].concat.apply([],W.map(function(w){return w.sessions}));
  var byDate={};all.forEach(function(s){byDate[s.date]=s});
  var runs=all.filter(function(s){return s.km>0&&s.date!==D.raceDate});
  var runsDone=runs.filter(function(s){return s.status==='done'});
  var kmDone=Math.round(runsDone.reduce(function(a,s){return a+s.actualKm},0));
  var kmAll=Math.round(runs.reduce(function(a,s){return a+s.km},0));
  var checkable=function(w){return w.sessions.filter(function(s){return s.status!=='rest'})};
  var doneOf=function(w){return checkable(w).filter(function(s){return s.status==='done'}).length};
  var hasRace=function(w){return w.sessions.some(function(s){return s.date===D.raceDate})};

  $('kDays').textContent=Math.max(0,togo);
  if(togo===0)$('kDaysL').textContent='Race day';
  $('kRuns').innerHTML=runsDone.length+'<small>/'+runs.length+'</small>';
  $('kKm').innerHTML=kmDone+'<small>/'+kmAll+'</small>';
  $('updated').textContent='Last updated '+dm(D.updated);

  // Calendar: a row per week, a square per day. Read-only.
  var sqClass=function(s){return (s.status+(s.type==='Race'?' race':'')+(s.date===today?' tdd':'')).trim()};
  $('cal').innerHTML=all.map(function(s){return '<i class="'+sqClass(s)+'"></i>'}).join('');
  $('cal').setAttribute('aria-label','70-day plan: '+all.filter(function(s){return s.status==='done'}).length+' of '+all.filter(function(s){return s.status!=='rest'}).length+' sessions done');

  // Week picker: one halftone column per week, a square per 5 km; ink = run, faint = still to run.
  function dots(planned,done){
    var full=Math.floor(planned/5), rem=(planned%5)/5, df=Math.floor(done/5), c=[];
    for(var r=0;r<full;r++)c.push('<b'+(r>=df?' class="todo"':'')+'></b>');
    if(rem>0.1)c.push('<b class="part'+(done>=planned?'':' todo')+'" data-f="'+rem.toFixed(2)+'"><i></i></b>');
    var rows='';for(var i=0;i<c.length;i+=2)rows+='<span>'+c[i]+(c[i+1]||'')+'</span>';
    return rows;
  }
  $('picker').innerHTML=W.map(function(w){
    var race=hasRace(w);
    return '<button type="button" class="wk'+(w.week===nowWeek?' now':'')+'" data-w="'+w.week+'" aria-label="Week '+w.week+', '+w.doneKm+' of '+w.plannedKm+' km run'+(race?' plus race':'')+(w.week===nowWeek?', this week':'')+'">'+
      '<span class="dots" aria-hidden="true">'+dots(w.plannedKm,w.doneKm)+'</span><span class="n">'+pad(w.week)+'</span><span class="k">'+(race?'RACE':w.plannedKm)+'</span></button>';
  }).join('');
  [].forEach.call(document.querySelectorAll('.dots b.part'),function(b){var s=b.getBoundingClientRect().width;var px=Math.max(2,Math.round(s*Math.sqrt(+b.dataset.f)));b.firstChild.style.width=px+'px';b.firstChild.style.height=px+'px'});

  function stepsHTML(st){
    return '<tbody>'+(st||[]).map(function(r){return '<tr><td class="a">'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="t plain wrap">'+esc(r[2]||'')+'</td></tr>'}).join('')+'</tbody>';
  }
  var showType=function(s){return s.title.toLowerCase().indexOf(s.type.toLowerCase())!==0&&!/strength/i.test(s.title)};
  var CHIP={Long:'key',Quality:'key',Race:'race',Recovery:'rec',Strength:'rest',Mobility:'rest',Rest:'rest'};
  var chip=function(s){return '<span class="chip '+(CHIP[s.type]||'')+'">'+esc(s.type==='Long'?'Long run':s.type)+'</span>'};
  // Filled chips (long, quality, race) always show; others only when the title doesn't already say it.
  var wantChip=function(s){return /^(key|race)$/.test(CHIP[s.type]||"")||showType(s)};

  var DOWL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function showDay(o){
    var date=addDay(today,o), s=byDate[date], el=$('today');
    [].forEach.call(document.querySelectorAll('.today .seg button'),function(b){b.setAttribute('aria-pressed',String(+b.dataset.o===o))});
    $('tDate').textContent=DOWL[new Date(date).getUTCDay()]+' '+dm(date);
    el.className='today '+(s?s.status:'rest');
    $('tSteps').hidden=true;
    if(!s){$('tName').textContent=date<D.planStart?'Plan starts '+dm(D.planStart):'Block complete';$('tMeta').innerHTML='';$('tKm').innerHTML='';return}
    $('tName').textContent=s.title;
    var bits=[];
    if(s.status!=="rest"&&wantChip(s))bits.push(chip(s));
    if(s.status==='done')bits.push('<span class="lbl" style="color:var(--blood)">Done</span>');
    $('tMeta').innerHTML=bits.join('');
    $('tKm').innerHTML=s.km?s.km+'<small>KM</small>':'';
    if(s.status!=='rest'&&s.steps&&s.steps.length){$('tSteps').innerHTML=stepsHTML(s.steps);$('tSteps').hidden=false}
  }
  document.querySelector('.today .seg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)showDay(+b.dataset.o)});
  showDay(0);

  var cur=0;
  function show(n){
    n=Math.max(1,Math.min(W.length,n));cur=n;
    var w=W[n-1], c=checkable(w), d=doneOf(w);
    [].forEach.call(document.querySelectorAll('.wk'),function(b){b.setAttribute('aria-pressed',String(+b.dataset.w===n))});
    $('wtitle').textContent='Week '+n;
    $('sDone').innerHTML=d+'<small>/'+c.length+'</small>';
    $('sKm').innerHTML=w.doneKm+'<small>/'+w.plannedKm+'</small>';
    $('meter').style.width=(c.length?d/c.length*100:0)+'%';
    $('days').innerHTML=w.sessions.map(function(s){
      var isToday=s.date===today, mon=MON[+s.date.slice(5,7)-1];
      var dd='<div class="dd"><span class="lbl">'+s.day+'</span><b>'+(+s.date.slice(8,10))+'</b><span class="lbl">'+mon+'</span></div>';
      var state={done:'done',missed:'missed',planned:'to do',rest:'rest day'}[s.status];
      var label=' aria-label="'+esc(s.day+' '+dm(s.date)+': '+s.title+(s.km?', '+s.km+' km':'')+', '+state)+'"';
      if(s.status==='rest'&&!isToday){
        var note=(s.steps||[]).map(function(r){return r[1]+(r[2]?' ('+r[2]+')':'')}).join(' · ');
        return '<li class="day rest slim"'+label+'>'+dd+'<div class="dmain"><div class="dname">'+esc(s.title)+'</div>'+(note?'<p class="slimnote">'+esc(note)+'</p>':'')+'</div></li>';
      }
      var cls=['day','panel',s.status];
      if(isToday)cls.push('is-today');
      var head=(isToday?'<span class="chip tdy">Today</span>':'')+(wantChip(s)?chip(s):"")+(s.km?'<span class="dkm">'+s.km+' km</span>':'');
      var st=isToday?'<p class="slimnote">Full session in the Today card above.</p>':s.status!=='rest'&&s.steps&&s.steps.length?'<table class="steps">'+stepsHTML(s.steps)+'</table>':'';
      return '<li class="'+cls.join(' ')+'"'+label+'>'+dd+
        '<div class="dmain"><div class="dhead">'+head+'</div><div class="dname">'+esc(s.title)+'</div>'+st+'</div>'+
        (s.status==='rest'?'':'<i class="chk" aria-hidden="true"></i>')+'</li>';
    }).join('');
    try{history.replaceState(null,'','#w'+n)}catch(e){}
  }
  $('picker').addEventListener('click',function(e){var b=e.target.closest('.wk');if(b)show(+b.dataset.w)});
  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('input,textarea'))return;
    if(e.key==='ArrowRight')show(cur+1);else if(e.key==='ArrowLeft')show(cur-1);
  });
  var m=/^#w(\d+)$/.exec(location.hash);
  show(m?+m[1]:nowWeek);

  // Theme follows the system until the reader picks one.
  var root=document.documentElement, KEY='sgim-theme';
  try{var saved=localStorage.getItem(KEY)||localStorage.getItem('sgim-tracker-theme');if(saved)root.setAttribute('data-theme',saved)}catch(e){}
  $('mode').addEventListener('click',function(){
    var dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    var next=dark?'light':'dark';root.setAttribute('data-theme',next);
    try{localStorage.setItem(KEY,next)}catch(e){}
  });

  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2400)}

  // ---- Week image: 1080 × 1350 (4:5, fits an Instagram post), printed like the page: paper, ink, two spot inks, halftone.
  function poster(n){
    var w=W[n-1], cs=getComputedStyle(root), v=function(k){return cs.getPropertyValue(k).trim()};
    var C={bg:v('--silver'),ink:v('--ink'),ink2:v('--ink-2'),red:v('--blood'),blue:v('--blue'),on:'#F1F0EA',on2:'rgba(241,240,234,.72)',dot:v('--dot'),hair2:v('--hair-2')};
    var S=1080,H=1350,P=72,cv=document.createElement('canvas');cv.width=S;cv.height=H;
    var x=cv.getContext('2d'), D='"Big Shoulders Display","Arial Narrow",sans-serif', U='Archivo,"Helvetica Neue",Arial,sans-serif', M='"DM Mono",ui-monospace,Menlo,monospace';
    var ls=function(px){if('letterSpacing' in x)x.letterSpacing=px+'px'};
    var font=function(f,sp){x.font=f;ls(sp||0)};
    var fit=function(t,max){if(x.measureText(t).width<=max)return t;while(t.length&&x.measureText(t+'…').width>max)t=t.slice(0,-1);return t.replace(/[\s·,]+$/,'')+'…'};
    var T=(window.SGIM&&window.SGIM.tex)||{};
    var tint=function(src,col){var c=document.createElement('canvas');c.width=src.width;c.height=src.height;var g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return c};
    var dotFill=function(X,Y,Wd,Hd,col,step,r){x.fillStyle=col;x.beginPath();for(var yy=Y+step/2;yy<Y+Hd;yy+=step)for(var xx=X+step/2;xx<X+Wd;xx+=step){x.moveTo(xx+r,yy);x.arc(xx,yy,r,0,7)}x.fill()};
    // chip: flat block or outlined label, sized from measured text plus letter-spacing; returns its width
    var CH=34, chip=function(label,X,Y,fill,fg,outline){font('500 18px '+M);var cw=x.measureText(label).width+1.6*(label.length-1)+26;
      if(outline){x.strokeStyle=outline;x.lineWidth=2;x.strokeRect(X+1,Y+1,cw-2,CH-2)}else{x.fillStyle=fill;x.fillRect(X,Y,cw,CH)}
      font('500 18px '+M,1.6);x.fillStyle=fg;x.textBaseline='middle';x.fillText(label,X+13,Y+CH/2+1);x.textBaseline='top';return cw};

    // paper
    x.fillStyle=C.bg;x.fillRect(0,0,S,H);
    x.textBaseline='top';
    // the race-morning sun in halftone, rising off the top-right corner (same weight as on the page)
    if(T.sun){x.globalAlpha=.92;x.drawImage(tint(T.sun,C.red),S-440,-120,500,500);x.globalAlpha=1}

    // masthead
    x.strokeStyle=C.red;x.lineWidth=3;x.beginPath();x.moveTo(P+8,P+2);x.lineTo(P+8,P+22);x.moveTo(P-2,P+12);x.lineTo(P+18,P+12);x.stroke();
    font('800 30px '+D,.6);x.fillStyle=C.ink;x.fillText('SGIM 2026 TRAINING PLAN',P+30,P-1);
    // WEEK N, huge, with the red plate slightly off register
    var y=P+56;
    font('800 190px '+D,1);x.fillStyle=C.red;x.fillText('WEEK '+n,P-4+7,y+5);x.fillStyle=C.ink;x.fillText('WEEK '+n,P-4,y);
    y+=196;
    // progress at poster size: the count, then the fraction and unit stacked beside it
    var c=checkable(w), d=doneOf(w), sx=P;
    [[d,'/'+c.length,'DONE'],[w.doneKm,'/'+w.plannedKm,'KM']].forEach(function(p){
      font('800 124px '+D);x.fillStyle=C.ink;x.fillText(String(p[0]),sx-2,y);sx+=x.measureText(String(p[0])).width+10;
      font('500 30px '+M,.6);x.fillStyle=C.ink;x.fillText(p[1],sx,y+44);
      font('500 20px '+M,2);x.fillStyle=C.ink2;x.fillText(p[2],sx,y+82);
      font('500 30px '+M,.6);var uw=x.measureText(p[1]).width;font('500 20px '+M,2);sx+=Math.max(uw,x.measureText(p[2]).width)+64;
    });
    y+=126;
    // meter: a visible halftone track with the done share printed in red, then the heavy rule
    dotFill(P,y,S-2*P,16,C.hair2,5,1.6);x.fillStyle=C.red;x.fillRect(P,y,(S-2*P)*(c.length?d/c.length:0),16);
    y+=30;x.fillStyle=C.ink;x.fillRect(P,y,S-2*P,5);y+=5;

    // one ruled row per day, filling the frame down to the address. No "today" here: a shared image outlives the day.
    var bandH=70, rowH=(H-bandH-54-y)/7;
    w.sessions.forEach(function(s,i){
      var ry=y+i*rowH, h=rowH, rest=s.status==='rest', fg=C.ink, fg2=C.ink2;
      if(rest)dotFill(P,ry,S-2*P,h-2,C.dot,7,1.3);
      x.fillStyle=C.ink;x.fillRect(P,ry+h-2,S-2*P,2);
      var note=rest?(s.steps||[]).map(function(r){return r[1]+(r[2]?' ('+r[2]+')':'')}).join(' · '):'';
      // date block
      var dy=ry+(h-74)/2;
      font('500 17px '+M,1.6);x.fillStyle=fg2;x.fillText(s.day.toUpperCase(),P+18,dy);
      font('800 58px '+D);x.fillStyle=rest?C.ink2:fg;x.fillText(String(+s.date.slice(8,10)),P+16,dy+20);
      var tx=P+120, tw=S-2*P-120-78;
      // title over a second line, centred as a pair
      var blockH=rest&&!note?34:34+14+CH, ty=ry+(h-blockH)/2;
      font((rest?'500 31px ':'600 33px ')+U,-.3);x.fillStyle=rest||s.status==='missed'?C.ink2:fg;
      var title=fit(s.title,tw);x.fillText(title,tx,ty);
      if(s.status==='done'){x.fillStyle=C.red;x.fillRect(tx,ty+18,x.measureText(title).width,3)}
      var lx=tx, ly=ty+48, mid=ly+CH/2+1;
      var text=function(t,f,col){font(f);x.fillStyle=col;x.textBaseline='middle';x.fillText(t,lx,mid);x.textBaseline='top';lx+=x.measureText(t).width+14};
      if(rest){if(note)text(fit(note,tw),'400 19px '+M,C.ink2);return}
      if(wantChip(s)){var k=CHIP[s.type]||'',lab=s.type==='Long'?'LONG RUN':s.type.toUpperCase();
        lx+=(k==='race'?chip(lab,lx,ly,C.red,'#fff'):k==='key'?chip(lab,lx,ly,fg,C.bg):chip(lab,lx,ly,null,fg,fg))+10}
      if(s.km){lx+=2;text(s.km+' km','500 21px '+M,fg);lx+=4}
      var core=(s.steps||[]).filter(function(r){return !/warm-up|cool-down|gel|breakfast|dinner|bed|time cap/i.test(r[1])});
      var sum=core.length===1&&s.km&&parseFloat(core[0][0])===s.km?'':core.map(function(r){return s.type==='Strength'||s.type==='Mobility'?r[1]:r[0]+' '+r[1]}).join(' · ');
      font('400 19px '+M);if(sum&&tx+tw-lx>80)text(fit(sum,tx+tw-lx),'400 19px '+M,fg2);
      // done square: a red stamp with a white tick
      var bx=S-P-22-30, by=ry+h/2-16;
      if(s.status==='done'){x.fillStyle=C.red;x.fillRect(bx,by,30,30);x.strokeStyle='#fff';x.lineWidth=3.5;x.beginPath();x.moveTo(bx+7,by+16);x.lineTo(bx+13,by+22);x.lineTo(bx+24,by+9);x.stroke()}
      else{x.strokeStyle=s.status==='missed'?fg2:fg;x.lineWidth=3;if(x.setLineDash)x.setLineDash(s.status==='missed'?[5,4]:[]);x.strokeRect(bx+1.5,by+1.5,27,27);if(x.setLineDash)x.setLineDash([])}
    });

    // footer: the address
    x.textBaseline='bottom';font('500 22px '+M,2);x.fillStyle=C.ink;x.textAlign='right';x.fillText('VNCK.XYZ/MARATHON-TRAINING',S-P,H-bandH-16);x.textAlign='left';
    // then a blue halftone fade bleeding off the bottom edge
    var top=H-bandH;x.fillStyle=C.blue;x.beginPath();
    for(var yy=top+5;yy<H+6;yy+=10)for(var xx=5+(Math.round((yy-top-5)/10)%2?5:0);xx<S+6;xx+=10){var r=5.4*Math.pow((yy-top)/bandH,1.1);if(r>.4){x.moveTo(xx+r,yy);x.arc(xx,yy,r,0,7)}}
    x.fill();
    // print texture over everything: ink grain, then paper showing through as drop-out specks
    if(T.grain){x.globalAlpha=parseFloat(v('--grain-o'))||.2;x.fillStyle=x.createPattern(tint(T.grain,C.ink),'repeat');x.fillRect(0,0,S,H)}
    if(T.specks){x.globalAlpha=parseFloat(v('--specks-o'))||.85;x.fillStyle=x.createPattern(tint(T.specks,C.bg),'repeat');x.fillRect(0,0,S,H)}
    x.globalAlpha=1;
    return cv;
  }

  // ---- Image sheet: show the week as a real <img> so phones can long-press to save or share it.
  var sheet=$('sheet'), shot=$('shot'), lastBlob=null, lastName='', opener=null;
  var touch=matchMedia('(pointer:coarse)').matches;
  function openSheet(){sheet.hidden=false;root.classList.add('locked');$('shotClose').focus()}
  function closeSheet(){sheet.hidden=true;root.classList.remove('locked');if(opener&&opener.focus)opener.focus()}
  $('shotClose').addEventListener('click',closeSheet);
  sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet()});
  $('save').addEventListener('click',function(){
    // remember the opener before disabling it: a disabled button drops focus, and Close should hand it back
    var n=cur, btn=this;opener=btn;btn.disabled=true;
    var ready=document.fonts&&document.fonts.load?Promise.all(['800 190px "Big Shoulders Display"','600 33px Archivo','500 31px Archivo','500 22px "DM Mono"','400 19px "DM Mono"'].map(function(f){return document.fonts.load(f)})).catch(function(){}):Promise.resolve();
    ready.then(function(){
      var cv=poster(n);
      lastName='sgim-week-'+pad(n)+'.png';
      // a data: URL, not blob:, so long-press "Save to Photos" works across mobile browsers
      shot.src=cv.toDataURL('image/png');
      shot.alt='Week '+n+' of the SGIM 2026 training plan';
      cv.toBlob(function(blob){lastBlob=blob;btn.disabled=false;openSheet()},'image/png');
    });
  });
  $('shotSave').addEventListener('click',function(){
    var blob=lastBlob, name=lastName;if(!blob)return;
    // Inside Claude the viewer confirms the save; on the web, phones get the share sheet, desktops a download.
    var claudeSave=window.claude&&window.claude.use?window.claude.use('downloads').catch(function(){return null}):Promise.resolve(null);
    claudeSave.then(function(dl){
      if(dl)return dl.save({filename:name,data:blob}).then(function(){toast('Saved '+name)},function(e){if(!e||e.code!=='declined')toast('Could not save here. Press and hold the image instead')});
      var file=typeof File==='function'?new File([blob],name,{type:'image/png'}):null;
      if(touch&&file&&navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file]}).catch(function(){});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);toast('Saved '+name);
    });
  });
  window.__poster=poster;
}).catch(function(){
  document.querySelector('main').insertAdjacentHTML('afterbegin','<p class="src-note">Could not load the plan. Reload the page to try again.</p>');
});
</script>
</body>
</html>
